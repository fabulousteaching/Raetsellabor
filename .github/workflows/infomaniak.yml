# Rätsellabor: bei jeder Änderung auf «main» automatisch auf das Infomaniak-Webhosting hochladen
# (https://raetsellabor.fabulousteaching.ch).
# Die Zugangsdaten stehen als «Secrets» im Repository (Settings → Secrets and variables → Actions):
#   FTP_SERVER     z. B. xyzb.ftp.infomaniak.com   (Infomaniak-Manager → Webhosting → FTP / SSH)
#   FTP_BENUTZER   z. B. xyzb_raetsel
#   FTP_PASSWORT   Passwort dieses FTP-Kontos
#   FTP_ORDNER     Ordner der Website auf dem Server, mit «/» am Ende: /sites/raetsellabor.fabulousteaching.ch/
#                  (steht im Manager auf der Übersicht der Website)
#   KI_SCHLUESSEL  API-Schlüssel von Mistral (console.mistral.ai) für die KI-Wortvorschläge
#   BASISSCHRIFT   die Deutschschweizer Basisschrift als WOFF2-Datei in Base64 (© D-EDK; auf der Website mit Zustimmung
#                  der Dienststelle Volksschulbildung Kanton Luzern). Nicht im Repository, weil dieses öffentlich ist.
# Hochgeladen werden nur geänderte Dateien. Von Hand starten: Reiter «Actions» → «Auf Infomaniak hochladen» → «Run workflow».
name: Auf Infomaniak hochladen

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: infomaniak
  cancel-in-progress: false

jobs:
  hochladen:
    runs-on: ubuntu-latest
    steps:
      - name: Dateien holen
        uses: actions/checkout@v4

      - name: KI-Schlüssel für den Server bereitlegen (api/geheim.php, nicht im Repository)
        env:
          KI_SCHLUESSEL: ${{ secrets.KI_SCHLUESSEL }}
        run: |
          s=$(printf '%s' "$KI_SCHLUESSEL" | base64 -w0)
          printf "<?php\n// Beim Hochladen aus dem GitHub-Secret erzeugt. Nicht ins Repository!\nreturn ['schluessel' => base64_decode('%s')];\n" "$s" > api/geheim.php
          php -l api/geheim.php

      - name: Basisschrift für den Server bereitlegen (gemeinsam/schriften/, nicht im Repository)
        env:
          BASISSCHRIFT: ${{ secrets.BASISSCHRIFT }}
        run: |
          if [ -n "$BASISSCHRIFT" ]; then
            mkdir -p gemeinsam/schriften
            printf '%s' "$BASISSCHRIFT" | tr -d ' \r\n' | base64 -d > gemeinsam/schriften/DCH-Basisschrift.woff2
            head -c 4 gemeinsam/schriften/DCH-Basisschrift.woff2 | grep -q wOF2 && ls -l gemeinsam/schriften/
          else
            echo "Secret BASISSCHRIFT fehlt – die Basisschrift ist auf der Website nicht wählbar."
          fi

      - name: Versionsnummer an Skripte und Stile hängen (damit kein Browser eine alte Version aus dem Cache nimmt)
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(src|href)=\"((gemeinsam|raetsel)/[^\"?]+\.(js|css))\"#\1=\"\2?v=$v\"#g" index.html
          printf '%s\n' "$v" > version.txt   # für die Versionsprüfung offener Seiten (gemeinsam/labor.js)
          grep -o -E '(src|href)="(gemeinsam|raetsel)/[^"]+"' index.html

      - name: Per FTPS zu Infomaniak übertragen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_BENUTZER }}
          password: ${{ secrets.FTP_PASSWORT }}
          server-dir: ${{ secrets.FTP_ORDNER }}
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
